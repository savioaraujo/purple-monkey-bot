<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Roleta de Prêmios</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Oswald:wght@600;700&display=swap');
:root{--size:650px;--purple:#9146ff;--pink:#ff4fa3;--cyan:#36d7ff;--yellow:#ffd166}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,sans-serif}body{display:grid;place-items:center}.scene{position:relative;width:100vw;height:100vh;min-height:720px;display:grid;place-items:center;overflow:hidden}#fireworks{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}.glow{position:absolute;width:780px;height:780px;border-radius:50%;background:radial-gradient(circle at 30% 25%,rgba(54,215,255,.16),transparent 34%),radial-gradient(circle at 70% 25%,rgba(255,79,163,.18),transparent 34%),radial-gradient(circle at 50% 72%,rgba(145,70,255,.24),transparent 46%);filter:blur(32px);opacity:0;transform:scale(.72);animation:glowIn 1.2s ease .3s forwards;z-index:1}.wheel-wrap{position:relative;z-index:3;width:var(--size);height:var(--size);opacity:0;transform:translateY(180px) scale(.72) rotate(-8deg);animation:enter 1.15s cubic-bezier(.16,.86,.3,1.16) .25s forwards;transition:opacity .85s ease,transform .85s cubic-bezier(.4,0,.2,1),filter .85s ease}.wheel-wrap.exit{opacity:0;transform:translateY(180px) scale(.68) rotate(8deg);filter:blur(8px)}.frame{position:absolute;inset:0;border-radius:50%;padding:15px;background:linear-gradient(135deg,var(--cyan),var(--purple) 28%,var(--pink) 58%,var(--yellow));box-shadow:0 30px 70px rgba(0,0,0,.5),0 0 40px rgba(145,70,255,.25),0 0 90px rgba(255,79,163,.12)}.frame:before{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(255,255,255,.1);border-top-color:var(--cyan);border-right-color:var(--pink);animation:ring 8s linear infinite}.inner{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;background:#111}.inner:after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(255,255,255,.16),inset 0 0 38px rgba(0,0,0,.33);pointer-events:none;z-index:7}#wheel{width:100%;height:100%;display:block;border-radius:50%;will-change:transform}.cap{position:absolute;left:50%;top:50%;z-index:9;width:145px;height:145px;border-radius:50%;transform:translate(-50%,-50%);display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 35% 30%,#2a2035,#120e19 62%,#08070d);border:5px solid rgba(255,255,255,.15);box-shadow:0 0 0 6px rgba(145,70,255,.22),0 12px 26px rgba(0,0,0,.4);transition:.45s cubic-bezier(.2,.8,.2,1)}.cap.winner{transform:translate(-50%,-50%) scale(1.1);box-shadow:0 0 0 7px rgba(255,255,255,.1),0 0 30px rgba(255,79,163,.5),0 0 60px rgba(145,70,255,.45)}.small{display:block;color:#aaa1b6;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;margin-bottom:5px}#centerText{display:block;color:#fff;font:700 24px/1.05 Oswald,sans-serif;text-transform:uppercase;word-break:break-word;padding:0 10px}.pointer{position:absolute;z-index:15;top:-30px;left:50%;transform:translateX(-50%);width:82px;height:100px;filter:drop-shadow(0 10px 12px rgba(0,0,0,.45))}.pointer:before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--purple) 38%,var(--pink));border:5px solid rgba(255,255,255,.94);box-shadow:0 0 25px rgba(145,70,255,.42)}.pointer:after{content:"";position:absolute;top:43px;left:50%;transform:translateX(-50%);border-left:23px solid transparent;border-right:23px solid transparent;border-top:50px solid #fff}.banner{position:absolute;z-index:4;left:50%;bottom:26px;transform:translateX(-50%) translateY(40px);min-width:360px;max-width:80vw;padding:15px 24px;border-radius:18px;text-align:center;opacity:0;background:linear-gradient(90deg,rgba(54,215,255,.15),rgba(145,70,255,.24),rgba(255,79,163,.18));border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(12px);box-shadow:0 18px 35px rgba(0,0,0,.3);transition:opacity .45s ease,transform .55s cubic-bezier(.2,.8,.2,1)}.banner.show{opacity:1;transform:translateX(-50%) translateY(0)}.banner .label{color:#aaa2b9;font-size:10px;text-transform:uppercase;letter-spacing:.16em;font-weight:800}.banner .value{margin-top:4px;color:#fff;font:700 28px/1 Oswald,sans-serif;text-transform:uppercase}@keyframes enter{0%{opacity:0;transform:translateY(180px) scale(.72) rotate(-8deg)}62%{opacity:1;transform:translateY(-14px) scale(1.025) rotate(1deg)}100%{opacity:1;transform:none}}@keyframes glowIn{to{opacity:1;transform:scale(1)}}@keyframes ring{to{transform:rotate(360deg)}}@media(max-width:760px){:root{--size:82vw}.scene{min-height:100vh}.cap{width:112px;height:112px}#centerText{font-size:19px}.pointer{top:-24px;transform:translateX(-50%) scale(.8)}.banner{min-width:280px;bottom:18px}}
</style>
<style>
  html, body, .scene {
    background: transparent !important;
    background-color: transparent !important;
    background-image: none !important;
  }
  .glow {
    display: none !important;
  }
</style>
</head>
<body>
<main class="scene">
<canvas id="fireworks"></canvas>
<div class="wheel-wrap" id="wheelWrap"><div class="pointer"></div><div class="frame"><div class="inner"><canvas id="wheel"></canvas><div class="cap" id="cap"><div><span class="small" id="centerSmall">Roleta</span><span id="centerText">Prêmios</span></div></div></div></div></div>
<div class="banner" id="banner"><div class="label">Prêmio sorteado</div><div class="value" id="winnerText">Prêmio 1</div></div>
</main>
<script>
/* ================= LISTA DINÂMICA =================
   Troque apenas esta lista. A roleta se redesenha sozinha. */
const prizes=Array.from({length:20},(_,i)=>`Prêmio ${i+1}`);

/* Tempos */
const START_SPIN_AFTER=1900;
const SPIN_DURATION=10500;      // giro completo
const SHOW_WINNER_FOR=4000;    // fica aberta após parar
const FULL_TURNS=11;

const wheel=document.getElementById('wheel'),ctx=wheel.getContext('2d');
const wheelWrap=document.getElementById('wheelWrap'),cap=document.getElementById('cap');
const centerSmall=document.getElementById('centerSmall'),centerText=document.getElementById('centerText');
const banner=document.getElementById('banner'),winnerText=document.getElementById('winnerText');
const TAU=Math.PI*2;

function sliceColor(i,total){const h=(i*(360/total)+265)%360;return `hsl(${h} ${i%2?88:80}% ${i%3===0?54:47}%)`}
function resizeWheel(){const r=wheel.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);wheel.width=r.width*d;wheel.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);drawWheel()}
function drawWheel(){const r=wheel.getBoundingClientRect(),w=r.width,h=r.height,cx=w/2,cy=h/2,R=Math.min(w,h)/2,a=TAU/prizes.length;ctx.clearRect(0,0,w,h);
prizes.forEach((p,i)=>{const s=-Math.PI/2-a/2+i*a,e=s+a;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,s,e);ctx.closePath();ctx.fillStyle=sliceColor(i,prizes.length);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.38)';ctx.lineWidth=2;ctx.stroke();ctx.save();ctx.translate(cx,cy);ctx.rotate(s+a/2);ctx.textAlign='right';ctx.textBaseline='middle';const fs=prizes.length>16?15:prizes.length>10?17:20;ctx.font=`800 ${fs}px Inter, sans-serif`;ctx.fillStyle='#fff';ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=5;ctx.fillText(p,R-28,0);ctx.restore()});
ctx.beginPath();ctx.arc(cx,cy,R*.22,0,TAU);ctx.fillStyle='rgba(8,6,12,.78)';ctx.fill()}
addEventListener('resize',resizeWheel);requestAnimationFrame(resizeWheel);

let currentRotation=0,winnerIndex=-1;
function dramaticEase(t){
  /*
    Uma única curva contínua.
    Ela começa muito rápida e vai perdendo velocidade sem nunca
    parar antes da hora. Os últimos graus ficam lentos e dramáticos,
    mas a velocidade só chega a zero exatamente no prêmio.
  */
  return 1-Math.pow(1-t,3);
}
function startSpin(){winnerIndex=Math.floor(Math.random()*prizes.length);const slice=360/prizes.length;const normalized=((currentRotation%360)+360)%360;const target=(360-winnerIndex*slice)%360;let extra=target-normalized;if(extra<0)extra+=360;const total=FULL_TURNS*360+extra,start=currentRotation,final=start+total,t0=performance.now();centerSmall.textContent='Girando';centerText.textContent='Boa sorte';
function frame(now){const t=Math.min((now-t0)/SPIN_DURATION,1),e=dramaticEase(t);currentRotation=start+total*e;wheel.style.transform=`rotate(${currentRotation}deg)`;if(t<1)requestAnimationFrame(frame);else{currentRotation=final;wheel.style.transform=`rotate(${final}deg)`;finishSpin()}}requestAnimationFrame(frame)}
function finishSpin(){const prize=prizes[winnerIndex];centerSmall.textContent='Resultado';centerText.textContent=prize;winnerText.textContent=prize;cap.classList.add('winner');banner.classList.add('show');launchCelebration();setTimeout(()=>{wheelWrap.classList.add('exit');banner.classList.remove('show')},SHOW_WINNER_FOR)}
setTimeout(startSpin,START_SPIN_AFTER);

/* ================= FOGOS ================= */
const fw=document.getElementById('fireworks'),fx=fw.getContext('2d');let FW=0,FH=0,particles=[],celebrating=false,celebrateUntil=0,nextBurst=0;const colors=['#9146ff','#ff4fa3','#36d7ff','#ffd166','#ffffff','#56ff9d'];
function resizeFW(){const d=Math.min(devicePixelRatio||1,2);FW=fw.clientWidth;FH=fw.clientHeight;fw.width=FW*d;fw.height=FH*d;fx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resizeFW);resizeFW();
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`}
class Particle{constructor(x,y,c,a,s){this.x=x;this.y=y;this.c=c;this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;this.g=.045+Math.random()*.025;this.f=.986;this.life=1;this.dec=.01+Math.random()*.015;this.sz=1.3+Math.random()*2.8;this.hist=[]}update(){this.hist.push({x:this.x,y:this.y});if(this.hist.length>7)this.hist.shift();this.vx*=this.f;this.vy*=this.f;this.vy+=this.g;this.x+=this.vx;this.y+=this.vy;this.life-=this.dec}draw(){fx.beginPath();const p=this.hist[0]||this;fx.moveTo(p.x,p.y);fx.lineTo(this.x,this.y);fx.strokeStyle=rgba(this.c,Math.max(this.life,0));fx.lineWidth=this.sz;fx.lineCap='round';fx.stroke()}}
function burst(x,y){const count=58+Math.floor(Math.random()*34);for(let i=0;i<count;i++){const a=TAU*i/count+Math.random()*.12,s=2.8+Math.random()*5.2,c=colors[Math.floor(Math.random()*colors.length)];particles.push(new Particle(x,y,c,a,s))}}
function randomBurst(){const side=Math.random()>.5?1:-1,x=FW/2+side*(230+Math.random()*Math.max(80,FW*.18)),y=FH*(.16+Math.random()*.56);burst(x,y)}
function launchCelebration(){celebrating=true;celebrateUntil=performance.now()+SHOW_WINNER_FOR-350;nextBurst=0;setTimeout(randomBurst,0);setTimeout(randomBurst,120);setTimeout(randomBurst,240)}
function animateFW(now){fx.clearRect(0,0,FW,FH);if(celebrating&&now<celebrateUntil&&now>=nextBurst){randomBurst();nextBurst=now+260+Math.random()*280}else if(celebrating&&now>=celebrateUntil)celebrating=false;particles=particles.filter(p=>p.life>0);particles.forEach(p=>{p.update();p.draw()});requestAnimationFrame(animateFW)}requestAnimationFrame(animateFW);
</script>
</body>
</html>
