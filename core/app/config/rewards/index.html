<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recompensas</title>
<style>:root{color-scheme:dark;font-family:Arial;background:#202027;color:#f4ecff}body{margin:0;padding:18px}h1{font-size:20px;margin:0 0 14px}.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap}.toolbar{margin-bottom:14px}button{background:#3b2458;border:1px solid #7a5ba8;border-radius:6px;color:#fff;cursor:pointer;font-weight:700;padding:9px 12px}button.primary{background:#7b4ed4}.card{border:1px solid #5f4488;border-radius:10px;margin-bottom:12px;padding:14px}.grid{display:grid;grid-template-columns:1fr 140px;gap:10px}label{color:#c9c3b8;font-size:12px}input,select{box-sizing:border-box;background:#2c1c43;border:1px solid #7a5ba8;border-radius:6px;color:#fff;padding:8px;width:100%}.field{display:grid;gap:5px}.status{min-height:20px;color:#bde0aa;margin:8px 0}.danger{color:#ffb1a8}.hint{color:#c9c3b8;font-size:12px;margin:7px 0 12px}#logs{background:#15151a;border:1px solid #45404d;border-radius:8px;color:#d8d1df;font:12px Consolas,monospace;max-height:180px;overflow:auto;padding:10px;white-space:pre-wrap}</style></head>
<body><h1>Recompensas por pontos do canal</h1><div class="toolbar"><label>Canal <select id="channel"></select></label><button id="add" class="primary">Nova recompensa</button><button id="refresh">Atualizar</button></div><div id="eventsub" class="hint"></div><pre id="logs">Aguardando eventos...</pre><div id="status" class="status"></div><div id="list"></div>
<script>
let config;const $=s=>document.querySelector(s),list=$('#list');
async function load(){config=await(await fetch('/api/config')).json();const s=$('#channel'),old=s.value;s.innerHTML=(config.canais||[]).map((c,i)=>`<option value="${i}">${esc(c.nome)}</option>`).join('');s.value=old||'0';render();await diagnostics()}
async function diagnostics(){const [st,logs]=await Promise.all([fetch('/api/rewards/status').then(r=>r.json()),fetch('/api/rewards/logs').then(r=>r.json())]);$('#eventsub').textContent='EventSub: '+st.status+(st.ultimoErro?' — '+st.ultimoErro:'');$('#logs').textContent=logs.length?logs.slice(0,20).map(x=>new Date(x.data).toLocaleTimeString()+' ['+x.nivel.toUpperCase()+'] '+x.mensagem).join('\n'):'Nenhum evento registrado.'}
function rewards(){const c=config.canais[Number($('#channel').value)||0];c.recompensas=Array.isArray(c.recompensas)?c.recompensas:[];return c.recompensas}
function field(label,name,value,type='text'){const d=document.createElement('label');d.className='field';d.innerHTML=`<span>${label}</span><input name="${name}" type="${type}" value="${esc(value??'')}">`;return d}
function render(){list.innerHTML='';rewards().forEach((r,i)=>list.appendChild(card(r,i)))}
function card(r,i){const el=document.createElement('section');el.className='card';const g=document.createElement('div');g.className='grid';g.append(field('Título na Twitch','titulo',r.titulo),field('Custo em pontos','custo',r.custo||100,'number'),field('ID da recompensa','rewardId',r.rewardId),field('Duração (segundos)','duracao',r.duracao||8,'number'),field('Imagem, GIF ou vídeo','midia',r.midia),field('Áudio','audio',r.audio),field('Descrição','descricao',r.descricao));const active=field('Ativa','ativo','','checkbox');active.querySelector('input').checked=r.ativo!==false;g.append(active);el.append(g);const up=document.createElement('div');up.className='actions';up.innerHTML='<input type="file" accept="image/*,video/*"><button>Enviar mídia</button><input type="file" accept="audio/*"><button>Enviar áudio</button>';const ins=up.querySelectorAll('input'),bs=up.querySelectorAll('button');bs[0].onclick=()=>upload(ins[0],el.querySelector('[name=midia]'));bs[1].onclick=()=>upload(ins[1],el.querySelector('[name=audio]'));el.append(up);const a=document.createElement('div');a.className='actions';a.innerHTML='<button class="primary">Salvar na Twitch e no bot</button><button>Excluir da Twitch e do bot</button>';a.children[0].onclick=()=>saveCard(el,i);a.children[1].onclick=()=>deleteReward(el,i);el.append(a);return el}
function read(el){const v=n=>el.querySelector(`[name=${n}]`);return{titulo:v('titulo').value.trim(),custo:Number(v('custo').value),rewardId:v('rewardId').value.trim(),duracao:Number(v('duracao').value),midia:v('midia').value.trim(),audio:v('audio').value.trim(),descricao:v('descricao').value.trim(),ativo:v('ativo').checked}}
async function saveCard(el,i){const item=read(el);if(!item.titulo||item.custo<1)return msg('Informe título e custo válido.',1);msg(item.rewardId?'Atualizando na Twitch...':'Criando na Twitch...');const res=await fetch('/api/rewards/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(item)}),body=await res.json();if(!res.ok)return msg(body.erro||'Erro ao sincronizar.',1);item.rewardId=body.id;rewards()[i]=item;await persist();await diagnostics();msg('Recompensa salva na Twitch e no bot.')}
async function deleteReward(el,i){const item=read(el);if(!confirm('Excluir esta recompensa da Twitch e do bot?'))return;msg('Excluindo...');const res=await fetch('/api/rewards/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rewardId:item.rewardId})}),body=await res.json();if(!res.ok)return msg(body.erro||'Erro ao excluir.',1);rewards().splice(i,1);await persist();await diagnostics();msg('Recompensa excluída da Twitch e do bot.')}
async function persist(){const res=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(config)}),body=await res.json();if(!res.ok)return msg(body.erro||'Erro ao salvar.',1);config=body;render();msg('Configuração salva.');try{parent.postMessage({type:'configSaved'},'*')}catch(_){}}
async function upload(input,target){if(!input.files[0])return msg('Escolha um arquivo.',1);msg('Enviando...');const f=input.files[0],data=await new Promise((ok,no)=>{const r=new FileReader;r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(f)}),res=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:f.name,data})}),body=await res.json();if(!res.ok)return msg(body.erro||'Erro no upload.',1);target.value=body.path;msg('Upload concluído; salve a recompensa.')}
function msg(t,e){$('#status').textContent=t;$('#status').className=e?'status danger':'status'}function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('#add').onclick=()=>{rewards().push({titulo:'',custo:100,duracao:8,ativo:true});render()};$('#refresh').onclick=load;$('#channel').onchange=render;load().catch(e=>msg(e.message,1));setInterval(()=>diagnostics().catch(()=>{}),3000);
</script></body></html>
