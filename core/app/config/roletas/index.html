<!doctype html><meta charset="utf-8"><title>Roletas</title>
<style>body{font:14px Arial;background:#1b1024;color:#fff;padding:24px}main{max-width:920px;margin:auto}.card{padding:18px;margin:14px 0;background:#2d1c44;border:1px solid #654080;border-radius:9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.section{border-top:1px solid #654080;padding-top:14px;margin-top:14px}label{display:block}input,textarea,select,button{box-sizing:border-box;width:100%;padding:9px;margin:5px 0;background:#2c1c43;color:#fff;border:1px solid #7a5ba8;border-radius:6px}textarea{min-height:90px}button{width:auto}.upload input[type=file]{display:block;width:100%}.danger{color:#ffb1a8}.hint{color:#aaa;font-size:12px}</style>
<main><h1>Configuração de roletas</h1><div id="list"></div><button id="add">Nova roleta</button></main>
<script>
let config;
const $=id=>document.getElementById(String(id||'').replace(/^#/,'')), canal=()=>config.canais[0];
const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const value=(e,k)=>{const x=e.querySelector(`[data-k=${k}]`);return x&&x.multiple?[...x.selectedOptions].map(o=>o.value):x?x.value.trim():''};
function options(items,selected){const selecionados=Array.isArray(selected)?selected:[selected];return (items||[]).map(item=>{const v=typeof item==='object'?item.value:item,l=typeof item==='object'?item.label:item;return `<option value="${esc(v)}" ${selecionados.includes(v)?'selected':''}>${esc(l)}</option>`}).join('')}
async function ttsApi(card){const provider=value(card,'provider')||'puter',language=value(card,'language')||'pt-BR',pp=value(card,'puterProvider')||card.dataset.puterProvider||'',model=value(card,'model')||card.dataset.model||'',p=new URLSearchParams({provider,language});if(pp)p.set('puterProvider',pp);if(model)p.set('model',model);return fetch('/api/tts/options?'+p).then(r=>r.json())}
async function atualizarTts(card,preservar=true){const provider=value(card,'provider')||'puter',data=await ttsApi(card),pp=card.querySelector('[data-k=puterProvider]'),model=card.querySelector('[data-k=model]'),lang=card.querySelector('[data-k=language]'),voice=card.querySelector('[data-k=voice]'),oldVoice=preservar?(card.dataset.voice||voice.value):'';card.querySelector('.puter-fields').style.display=provider==='puter'?'grid':'none';pp.innerHTML=options(data.puterProviders||[],pp.value||card.dataset.puterProvider||'aws-polly');model.innerHTML=options(data.models||[],model.value||card.dataset.model||'');lang.innerHTML=options(data.languages||[],data.language||lang.value);voice.innerHTML=options(data.voiceOptions||data.voices||[],oldVoice);card.dataset.voice='';card.dataset.model='';card.dataset.puterProvider=''}
function render(){const c=canal();c.roletas=c.roletas||[];$('#list').innerHTML=c.roletas.map((r,i)=>{const o=r.ttsOptions||{};return `<section class="card" data-voice="${esc(o.voice)}" data-model="${esc(o.model)}" data-puter-provider="${esc(o.puterProvider)}"><h2>${esc(r.nome||'Nova roleta')}</h2><div class="grid"><label>Nome<input data-k="nome" value="${esc(r.nome)}"></label><label>Lista<select data-k="lista"><option value="">Prêmios próprios</option>${options((c.listas||[]).map(l=>l.nome),r.lista)}</select></label></div><label>Prêmios próprios<textarea data-k="premios">${esc((r.premios||[]).join('\n'))}</textarea></label><div class="section"><h3>Acionamento</h3><label>Tipo<select data-k="acionamento">${options(['comando','regex','recompensa'],r.acionamento||'comando')}</select></label><label>Comando<input data-k="comando" value="${esc(r.comando)}"></label><label>Regex<input data-k="regex" value="${esc(r.regex)}"></label><label>Recompensas<select multiple size="3" data-k="recompensas">${options((c.recompensas||[]).map(x=>({value:x.rewardId||x.titulo,label:x.titulo})),null)}</select></label></div><div class="section"><h3>Efeitos</h3><div class="grid"><label>Áudio de entrada<div class="upload"><input data-k="audioInicio" value="${esc(r.audioInicio)}"><input type="file" accept="audio/*" onchange="upload(this,this.previousElementSibling)"></div></label><label>Áudio de saída<div class="upload"><input data-k="audioResultado" value="${esc(r.audioResultado)}"><input type="file" accept="audio/*" onchange="upload(this,this.previousElementSibling)"></div></label></div><label>TTS<select data-k="ttsResultado">${options([{value:'false',label:'Não'},{value:'true',label:'Sim'}],String(!!r.ttsResultado))}</select></label><div class="tts" style="display:${r.ttsResultado?'block':'none'}"><label>Provider<select data-k="provider">${options(['puter','local'],o.provider||'puter')}</select></label><div class="grid puter-fields"><label>Provider Puter<select data-k="puterProvider"></select></label><label>Modelo / engine<select data-k="model"></select></label></div><div class="grid"><label>Idioma<select data-k="language"><option>${esc(o.language||'pt-BR')}</option></select></label><label>Voz<select data-k="voice"><option>${esc(o.voiceLabel||o.voice||'')}</option></select></label></div></div></div><div class="section"><h3>Restrições</h3><div class="grid"><label>Usuários<input data-k="usuarios" value="${esc((r.usuarios||[]).join(', '))}"></label><label>Cargos<input data-k="cargos" value="${esc((r.cargos||[]).join(', '))}"></label></div></div><button onclick="save(${i},this)">Salvar</button> <button class="danger" onclick="del(${i})">Excluir</button></section>`}).join('');document.querySelectorAll('.card').forEach(card=>{const t=card.querySelector('[data-k=ttsResultado]');t.onchange=()=>{card.querySelector('.tts').style.display=t.value==='true'?'block':'none';if(t.value==='true')atualizarTts(card)};['provider','puterProvider','model','language'].forEach(k=>card.querySelector(`[data-k=${k}]`).onchange=()=>atualizarTts(card,k==='language'));if(t.value==='true')atualizarTts(card)})}
async function upload(i,t){if(!i.files[0])return;const f=i.files[0],d=await new Promise(ok=>{const r=new FileReader;r.onload=()=>ok(r.result.split(',')[1]);r.readAsDataURL(f)}),res=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:f.name,data:d})}),b=await res.json();if(res.ok)t.value=b.path;else alert(b.erro||'Falha no upload')}
async function persist(){const r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(config)}),b=await r.json();if(!r.ok)return alert(b.erro||'Erro');config=b;render()}
async function save(i,b){const e=b.closest('.card'),r=canal().roletas[i];['nome','lista','acionamento','comando','regex','audioInicio','audioResultado'].forEach(k=>r[k]=value(e,k)||undefined);r.premios=value(e,'premios').split('\n').map(x=>x.trim()).filter(Boolean);r.recompensas=value(e,'recompensas');r.ttsResultado=value(e,'ttsResultado')==='true';const voice=e.querySelector('[data-k=voice]'),savedVoice=e.dataset.voice||voice.value;r.ttsOptions={provider:value(e,'provider')||'puter',puterProvider:e.dataset.puterProvider||value(e,'puterProvider')||null,model:e.dataset.model||value(e,'model')||null,language:value(e,'language')||'pt-BR',voice:savedVoice,voiceLabel:voice.selectedOptions[0]?voice.selectedOptions[0].textContent:savedVoice};r.usuarios=value(e,'usuarios').split(',').map(x=>x.trim()).filter(Boolean);r.cargos=value(e,'cargos').split(',').map(x=>x.trim()).filter(Boolean);if(!r.lista&&!r.premios.length)return alert('Informe prêmios ou lista');await persist()}
async function del(i){canal().roletas.splice(i,1);await persist()}
$('#add').onclick=()=>{canal().roletas.push({nome:'nova-roleta',acionamento:'comando',premios:[],recompensas:[],ttsOptions:{provider:'puter',puterProvider:'aws-polly',language:'pt-BR'}});render()};
(async()=>{config=await fetch('/api/config').then(r=>r.json());render()})();
</script>
